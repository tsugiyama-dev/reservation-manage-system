<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>会員登録</title>
</head>
<body>
	<form th:action="@{/auth/register}" method="post">
        <div>
            <label>ユーザー名</label>
            <input name="username" required>
        </div>
        <div>
            <label>パスワード</label>
            <input type="password" name="password" required>
        </div>
		<div>
			<label>メールアドレス</label>
			<input type="email" name="email"required>
        <div>
		<div>
            <button type="submit">登録</button>
        </div>
    </form>
	<a th:href="@{/auth/login}">ログインはこちら</a>
</body>
</html>
